version: '3.7'

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    command:
      - redpanda
      - start
      - --smp 2
      - --memory 2G
      - --reserve-memory 256M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports:
      - 9092:9092
      - 29092:29092
    volumes:
      - redpanda_data:/var/lib/redpanda/data

  risingwave:
    image: risingwavelabs/risingwave:latest
    ports:
      - 4566:4566   # PSQL connection port
      - 5691:5691   # Dashboard
    environment:
      - RW_MODE=standalone
    volumes:
      - rw_data:/risingwave/data

volumes:
  redpanda_data:
  rw_data:
