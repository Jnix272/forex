# Lightweight fast-training probe.
# Purpose: prove the rebuilt dataset/labels train cleanly before scaling up.

data:
  source: dukascopy
  pair: EURUSD
  pairs:
    - EURUSD
    - GBPUSD
    - USDJPY
  pair_embed_dim: 4
  pair_align: inner
  corr_window: 10
  corr_window_long: 30
  momentum_window: 10
  start: "2018-01-01"
  end: "2025-12-31"
  full_day_data: false
  n_ticks: 20_000_000
  chunk_size: 150_000
  use_cache: true
  integrity_gate: true
  auto_rebuild_on_mismatch: true

model:
  name: mamba
  all_models: false
  hidden_size: 64
  d_model: 64
  nhead: 4
  num_layers: 2
  dropout: 0.15

training:
  epochs: 10
  batch_size: 128
  lr: 0.00005
  lr_warmup_epochs: 2
  resume: false
  seq_len: 30
  patience: 5
  val_split: 0.2
  loss: cross_entropy
  label_method: rl_reward
  early_stop_metric: sharpe
  early_stop_min_delta: 0.01
  save_every: 2
  grad_clip: 1.0
  grad_accum_steps: 1
  weight_decay: 0.0001
  amp: true
  cross_asset_mode: auto

walk_forward:
  enabled: false
  folds: 1

multitask:
  enabled: true
  w_ret: 0.15
  w_conf: 0.05

pretrain:
  enabled: false
  epochs: 0
  regime_aware: false

ensemble:
  enabled: false
  deploy: false
  epochs: 0
  div_weight: 0.0

rl:
  enabled: false
  deploy: false
  # When RL is enabled, training also writes rl_<algo>_execution.onnx for the optional 10-action C++ execution layer.
  algo: dqn
  episodes: 0

hardware:
  num_workers: 4
  prefetch_factor: 4

tracking:
  no_wandb: true
  run_name: fast_mamba_probe

quick:
  enabled: false

paths:
  checkpoint_dir: "checkpoints"
  data_cache: "data/processed"
