# Forex Pipeline Configuration
# ============================
# Complete configuration for the data pipeline

name: "forex_pipeline"
version: "1.0.0"
description: "Full forex data pipeline with validation, quality gates, and feature store"
created_at: "2026-01-15T00:00:00"

# Data Source Configuration
data_source:
  type: "dukascopy"  # dukascopy, databento, tds, synthetic
  pairs:
    - "EURUSD"
    - "GBPUSD"
    - "USDJPY"
    - "AUDUSD"
    - "EURGBP"
    - "EURJPY"
    - "GBPJPY"
    - "USDCAD"
    - "USDCHF"
    - "NZDUSD"
  start_date: "2008-01-01"
  end_date: "2015-12-31"
  data_root: "data/raw/dukascopy"

# Bar/Resampling Configuration
bars:
  bar_type: "time"  # time, tick, volume, dollar
  freq: "5m"
  session_filter: true
  session_mode: "dst"  # fixed or dst
  session_start_utc: "07:00"
  session_end_utc: "21:00"
  tick_threshold: 500
  volume_threshold: 10000.0
  dollar_threshold: 1000000.0
  gap_policy: "drop"  # drop, ffill, interpolate
  gap_max_minutes: 5
  spread_cap_multiplier: 3.0
  apply_frac_diff: true
  frac_diff_order: 0.4

# Feature Engineering Configuration
features:
  groups:
    - "core"
    - "microstructure"
    - "momentum"
    - "regime"
    - "cross_asset"
    - "macro"
    - "sentiment"
    - "candlestick"
    - "volume_profile"
    - "volatility_clock"
    - "risk_control"
  cache_enabled: true
  ofi_z_threshold: 2.0
  slow_cols:
    - "sentiment_decayed"
    - "eco_surprise"
    - "hurst_exponent"
    - "cot_net_hf"
  enable_regime_gate: true
  enable_quality_gate: false
  enable_no_trade_zones: false
  finbert_dim: 8
  ca_corr_window: 60
  ca_regime_window: 240
  ca_lags: [1, 5, 15]

# Labeling Configuration
labeling:
  method: "rl_reward"  # rl_reward, triple_barrier, both
  lookahead_bars: 30
  profit_target_atr: 1.2
  stop_loss_atr: 0.8
  transaction_cost_pips: 1.5
  tb_profit_atr: 2.0
  tb_stop_atr: 1.0
  tb_horizon_bars: 60
  regime_aware: true
  execution_delay_bars: 1

# Dataset Building Configuration
dataset:
  seq_len: 120
  train_ratio: 0.7
  val_ratio: 0.15
  test_ratio: 0.15
  chunk_size: 500000
  chunk_overlap: 200
  output_format: "zarr"  # zarr, npy, parquet
  output_dir: "data/processed_2016_2025"
  compression: "lz4"
  compression_level: 1
  pairs:
    - "EURUSD"
    - "GBPUSD"
    - "USDJPY"
    - "AUDUSD"
    - "EURGBP"
    - "EURJPY"
    - "GBPJPY"
    - "USDCAD"
    - "USDCHF"
    - "NZDUSD"
  label_col: "label"
  difficulty_enabled: true

# Validation Configuration
validation:
  method: "purged_embargo"
  n_splits: 7
  purge_bars: 120
  embargo_bars: 60
  min_train_size: 50000
  quality_gates_enabled: true
  null_threshold: 0.01
  inf_threshold: 0.0
  psi_threshold: 0.2
  correlation_threshold: 0.99
  drift_detection_enabled: true
  drift_window: 1000
  schema_validation: true
  feature_schema_gate: true

# Quality Gates Configuration
quality_gates:
  enabled: true
  auto_remediate: true
  log_dir: "logs/quality_gates"
  stages:
    ingestion:
      null_threshold: 0.0
      inf_threshold: 0.0
    resampling:
      null_threshold: 0.01
      inf_threshold: 0.0
    feature_engineering:
      null_threshold: 0.01
      inf_threshold: 0.0
      psi_threshold: 0.2

# Lineage Tracking Configuration
lineage:
  enabled: true
  store_type: "file"  # file, sqlite
  path: "logs/lineage"
  track_git: true
  track_config: true

# Feature Store Configuration
feature_store:
  enabled: true
  store_type: "parquet"  # parquet, delta
  path: "./feature_store"
  partition_cols:
    - "pair"
    - "year"
    - "month"
    - "day"
  compression: "zstd"

# Incremental Processing Configuration
incremental:
  enabled: false
  state_dir: "./feature_state"
  warmup_bars: 200
  max_buffer_size: 10000

# Runtime Configuration
output_dir: "logs/pipeline"
log_level: "INFO"
random_seed: 42

# Hardware Configuration
hardware_profile: "ubuntu_rtx_laptop"
n_workers: 4
use_gpu: true

# Tags
tags:
  environment: "development"
  team: "forex-ml"

# ── Per-Model Training Stages ────────────────────────────────────────────────
# Each model family uses its own config and dataset for optimal performance.
#
#  Model Family  | Config                    | Label Method    | seq_len | Dataset Size
#  Deep (DL)     | config/run_deep.yaml      | rl_reward       | 120     | ~35 GB / ~9 hrs
#  RL agents     | config/run_rl.yaml        | rl_reward       | 60      | ~15 GB / ~4-5 hrs
#  Tabular (CB)  | config/run_tabular.yaml   | triple_barrier  | 30      | ~500 MB / ~2 hrs
#  Tabular (XGB) | config/run_tabular.yaml   | triple_barrier  | 30      | shared with CB
#
# Run order:
#   Step 1 - Build deep dataset:
#     python -m training.train_gpu --config config/run_deep.yaml --build-only
#
#   Step 2 - Train deep models (after step 1):
#     python -m training.train_gpu --config config/run_deep.yaml
#
#   Step 3 - Build RL dataset (intermediate, can run in parallel with step 1):
#     python -m training.train_gpu --config config/run_rl.yaml --build-only
#
#   Step 4 - Train RL agent (after step 3):
#     python -m training.train_gpu --config config/run_rl.yaml --rl-train --rl-algo dqn
#
#   Step 5 - Build tabular dataset (can run in parallel with steps 1 and 3):
#     python -m training.train_gpu --config config/run_tabular.yaml --build-only
#     # shorthand:
#     python -m training.train_gpu --tabular-build-only
#
#   Step 6 - Train CatBoost (after step 5):
#     python -m training.train_catboost --config config/run_tabular.yaml
#
#   Step 7 - Train XGBoost (after step 5):
#     python -m training.train_xgboost --config config/run_tabular.yaml
#
# Note: Steps 1, 3, and 5 can run concurrently on separate terminals/GPUs.
stages:
  - name: build_deep_dataset
    config: config/run_deep.yaml
    cmd: "python -m training.train_gpu --config config/run_deep.yaml --build-only"
    description: "Build the 10-year RL-reward dataset for deep learning models (35 GB, ~9 hrs)"

  - name: build_rl_dataset
    config: config/run_rl.yaml
    cmd: "python -m training.train_gpu --config config/run_rl.yaml --build-only"
    description: "Build the 8-year RL-reward dataset for RL agents (15 GB, ~4-5 hrs)"

  - name: build_tabular_dataset
    config: config/run_tabular.yaml
    cmd: "python -m training.train_gpu --config config/run_tabular.yaml --build-only"
    # shorthand via training/gpu_cli.py:
    # cmd: "python -m training.train_gpu --tabular-build-only"
    description: "Build the 7-year triple-barrier dataset for tree models (500 MB, ~2 hrs)"

  - name: train_deep
    depends_on: build_deep_dataset
    config: config/run_deep.yaml
    cmd: "python -m training.train_gpu --config config/run_deep.yaml"
    description: "Train HAELT / TFT / Transformer / Mamba / GNN deep learning models"

  - name: train_rl
    depends_on: build_rl_dataset
    config: config/run_rl.yaml
    cmd: "python -m training.train_gpu --config config/run_rl.yaml --rl-train --rl-algo dqn"
    description: "Train DQN/PPO RL agent on RL dataset (60-bar state, rl_reward)"

  - name: train_catboost
    depends_on: build_tabular_dataset
    config: config/run_tabular.yaml
    cmd: "python -m training.train_catboost --config config/run_tabular.yaml"
    description: "Train CatBoost classifier on tabular triple-barrier dataset"

  - name: train_xgboost
    depends_on: build_tabular_dataset
    config: config/run_tabular.yaml
    cmd: "python -m training.train_xgboost --config config/run_tabular.yaml"
    description: "Train XGBoost classifier on tabular triple-barrier dataset"
